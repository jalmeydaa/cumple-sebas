<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 200 254" width="200" height="254">
      <defs>
        <radialGradient id="gCabeza" cx="45%" cy="38%" r="70%">
          <stop offset="0" stop-color="#ffe3ea"/><stop offset=".55" stop-color="#ffbfcf"/><stop offset="1" stop-color="#f590ab"/>
        </radialGradient>
        <radialGradient id="gCuerpo" cx="45%" cy="35%" r="75%">
          <stop offset="0" stop-color="#ffd9e2"/><stop offset="1" stop-color="#f490aa"/>
        </radialGradient>
        <radialGradient id="gTrompa" cx="45%" cy="35%" r="70%">
          <stop offset="0" stop-color="#ffc4d3"/><stop offset="1" stop-color="#ee86a2"/>
        </radialGradient>
        <linearGradient id="gPolo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#3aa3e6"/>
        </linearGradient>
        <linearGradient id="gGorro" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb020"/>
        </linearGradient>
        <filter id="fSuave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <!-- sombra -->
      <ellipse cx="100" cy="232" rx="52" ry="7" fill="#000" opacity=".12"/>
      <!-- patitas -->
      <rect x="70" y="200" width="24" height="32" rx="12" fill="url(#gCuerpo)"/>
      <rect x="106" y="200" width="24" height="32" rx="12" fill="url(#gCuerpo)"/>
      <path d="M72 226 h20 v2 a6 6 0 0 1 -6 6 h-8 a6 6 0 0 1 -6 -6z M108 226 h20 v2 a6 6 0 0 1 -6 6 h-8 a6 6 0 0 1 -6 -6z" fill="#c9607e"/>
      <!-- colita -->
      <path d="M150 196 q14 -4 10 -14 q-4 -8 -10 -2 q-4 6 6 6" stroke="#f08aa5" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- cuerpo con polito -->
      <path d="M58 168 q0 -30 42 -30 q42 0 42 30 v22 q0 20 -42 20 q-42 0 -42 -20z" fill="url(#gPolo)"/>
      <path d="M58 190 q0 20 42 20 q42 0 42 -20" fill="none" stroke="#2b8fd0" stroke-width="2"/>
      <path d="M100 160 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="#ffd21f"/>
      <!-- bracitos cruzados -->
      <rect x="54" y="168" width="70" height="20" rx="10" fill="url(#gCuerpo)" transform="rotate(-8 89 178)"/>
      <rect x="76" y="166" width="70" height="20" rx="10" fill="url(#gCuerpo)" transform="rotate(8 111 176)"/>
      <circle cx="62" cy="181" r="5" fill="#f08aa5" opacity=".6"/><circle cx="138" cy="181" r="5" fill="#f08aa5" opacity=".6"/>
      <!-- orejas -->
      <path d="M38 62 q-6 -40 30 -34 q10 14 4 30 z" fill="url(#gCabeza)"/>
      <path d="M46 56 q-2 -22 18 -20 q4 10 0 18 z" fill="#f48aa6" opacity=".55"/>
      <path d="M162 62 q6 -40 -30 -34 q-10 14 -4 30 z" fill="url(#gCabeza)"/>
      <path d="M154 56 q2 -22 -18 -20 q-4 10 0 18 z" fill="#f48aa6" opacity=".55"/>
      <!-- cabeza -->
      <ellipse cx="100" cy="98" rx="72" ry="62" fill="url(#gCabeza)"/>
      <ellipse cx="78" cy="62" rx="22" ry="10" fill="#fff" opacity=".35" transform="rotate(-18 78 62)"/>
      <!-- gorrito de cumpleaños -->
      <g transform="rotate(14 120 40)">
        <path d="M98 50 L124 -2 L150 50 Z" fill="url(#gGorro)"/>
        <circle cx="114" cy="38" r="4" fill="#ff5c8a"/><circle cx="132" cy="30" r="3.5" fill="#3aa3e6"/>
        <circle cx="124" cy="16" r="3" fill="#ff5c8a"/><circle cx="138" cy="44" r="3.5" fill="#7ed957"/>
        <path d="M98 50 q26 8 52 0" stroke="#ff5c8a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="124" cy="-3" r="8" fill="#ff5c8a"/><circle cx="121" cy="-6" r="2.5" fill="#fff" opacity=".7"/>
      </g>
      <!-- marca de enojo -->
      <g stroke="#e8242c" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(44 44)">
        <path d="M-8 -2 q4 0 4 -6 M8 -2 q-4 0 -4 -6 M-8 6 q4 0 4 6 M8 6 q-4 0 -4 6"/>
      </g>
      <!-- cachetes inflados -->
      <ellipse cx="50" cy="112" rx="16" ry="11" fill="#ff7fa2" opacity=".55" filter="url(#fSuave)"/>
      <ellipse cx="150" cy="112" rx="16" ry="11" fill="#ff7fa2" opacity=".55" filter="url(#fSuave)"/>
      <!-- ojos (con párpado enojado) -->
      <ellipse cx="72" cy="94" rx="11" ry="13" fill="#2a1b2e"/>
      <ellipse cx="128" cy="94" rx="11" ry="13" fill="#2a1b2e"/>
      <circle cx="75" cy="94" r="4" fill="#fff"/><circle cx="68" cy="100" r="2" fill="#fff" opacity=".8"/>
      <circle cx="125" cy="94" r="4" fill="#fff"/><circle cx="132" cy="100" r="2" fill="#fff" opacity=".8"/>
      <path d="M56 74 L88 86 L88 70 L56 70 Z" fill="#ffc6d4"/>
      <path d="M144 74 L112 86 L112 70 L144 70 Z" fill="#ffc6d4"/>
      <!-- cejas -->
      <path d="M56 76 Q72 78 88 88" stroke="#6b2d45" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <path d="M144 76 Q128 78 112 88" stroke="#6b2d45" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <!-- trompita -->
      <ellipse cx="100" cy="120" rx="25" ry="17" fill="url(#gTrompa)"/>
      <ellipse cx="94" cy="113" rx="8" ry="4" fill="#fff" opacity=".4"/>
      <ellipse cx="91" cy="121" rx="4.5" ry="6.5" fill="#b5476a"/>
      <ellipse cx="109" cy="121" rx="4.5" ry="6.5" fill="#b5476a"/>
      <!-- boquita fruncida -->
      <path d="M90 146 q5 -6 10 -2 q5 -4 10 2" stroke="#8a3352" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
